name: Sync to Original Repo
on:
  push:
    branches: [main]
jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lovable Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We add this line to ensure it has the right credentials from the start
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Push to Original Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          # This is the line the error complained about
          API_TOKEN_GITHUB: ${{ secrets.SYNC_TOKEN }}
        with:
          source-directory: '.'
          destination-github-username: 'kudzimusar'
          destination-repository-name: 'morning-pulse'
          user-email: 'kudzi.musar@gmail.com'
          target-branch: main
