name: Sync to Original Repo
on:
  push:
    branches: [main]
jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lovable Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Force Push to Original Repo
        run: |
          # Set up git identity
          git config --global user.name "kudzimusar"
          git config --global user.email "kudzi.musar@gmail.com"
          
          # Add the original repo as a remote destination
          git remote add original https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/kudzimusar/morning-pulse.git
          
          # Force push the main branch to the original repo
          git push original main --force
